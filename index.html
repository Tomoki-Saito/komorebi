<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ごはん処 こもれび｜東京都港区</title>
  <meta name="description" content="東京都港区にある定食のお店、ごはん処 こもれびのページです。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="hero-note">2030 年 4 月 新規オープン</p>
    <h1>ごはん処 こもれび</h1>
    <p>東京都港区の、定食と季節の小鉢のお店です。</p>
    <p class="hero-phone">ご予約・お問い合わせ：<span id="phone-header"></span></p>
    <p class="open-status" id="open-status"></p>
  </header>
  <main>
    <section>
      <h2>お店について</h2>
      <p>毎朝炊くごはんと、季節の野菜を使った定食をお出ししています。</p>
      <p>営業時間：<span id="hours">準備中</span></p>
    </section>
    <section>
      <h2>ランチメニュー</h2>
      <button id="menu-button" type="button">メニューを見る</button>
      <ul id="menu-list" hidden></ul>
    </section>
    <section>
      <h2>ご予約</h2>
      <p>お電話でご予約いただけます。電話番号：<span id="phone-reserve"></span></p>
      <div class="reserve-form">
        <label>お名前 <input id="reserve-name" type="text"></label>
        <label>日付 <input id="reserve-date" type="date"></label>
        <label>人数 <input id="reserve-people" type="number" min="1" max="8" value="2"></label>
        <button id="reserve-button" type="button">予約する</button>
        <p id="reserve-message"></p>
      </div>
    </section>
    <section class="owner">
      <h2>店長用：ご予約の一覧</h2>
      <ul id="reserve-list"></ul>
      <p id="reserve-count"></p>
    </section>
  </main>
  <footer>
    <p>ごはん処 こもれび ／ 東京都港区 ／ 電話 <span id="phone-footer"></span></p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
